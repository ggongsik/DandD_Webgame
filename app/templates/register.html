<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
    <style> body { font-family: 'Gowun Dodum', sans-serif; } </style>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen">
    <div class="w-full max-w-md bg-gray-800 rounded-lg shadow-2xl p-8 border border-gray-700">
        <h2 class="text-3xl font-bold text-center mb-6">회원가입</h2>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="bg-red-700 border border-red-900 text-white px-4 py-3 rounded relative mb-4" role="alert">
                <span class="block sm:inline">{{ messages[0] }}</span>
            </div>
        {% endif %}
        {% endwith %}
        
        <form method="POST" action="{{ url_for('auth.register') }}">
            <div class="mb-4">
                <label for="username" class="block text-sm font-bold mb-2">사용할 아이디</label>
                <input type="text" id="username" name="username" class="shadow appearance-none border rounded w-full py-2 px-3 bg-gray-700 border-gray-600 text-white leading-tight focus:outline-none focus:shadow-outline" required>
            </div>
            <div class="mb-6">
                <label for="password" class="block text-sm font-bold mb-2">비밀번호</Labe>
                <input type="password" id="password" name="password" class="shadow appearance-none border rounded w-full py-2 px-3 bg-gray-700 border-gray-600 text-white mb-3 leading-tight focus:outline-none focus:shadow-outline" required>
            </div>
            <div class="flex flex-col items-center justify-between gap-4">
                <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline transition duration-300">
                    가입하기
                </button>
                <a class="w-full text-center bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline transition duration-300" href="{{ url_for('auth.login') }}">
                    로그인으로 돌아가기
                </a>
            </div>
        </form>
    </div>
</body>
</html>

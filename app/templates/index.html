<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D 어드벤처 - Flask 연동</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Gowun Dodum', sans-serif; }
        .vignette {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            box-shadow: inset 0 0 200px rgba(0,0,0,0.6); pointer-events: none;
        }
        .loading-overlay {
            position: fixed; inset: 0; background-color: rgba(0,0,0,0.8);
            display: flex; align-items: center; justify-content: center; z-index: 100;
        }
        #combat-log { scroll-behavior: smooth; }
        
        @keyframes cutscene-animation {
            0% { transform: translateX(-100%) skew(-20deg); opacity: 0; }
            20% { transform: translateX(0) skew(-20deg); opacity: 1; }
            80% { transform: translateX(0) skew(-20deg); opacity: 1; }
            100% { transform: translateX(100%) skew(-20deg); opacity: 0; }
        }
        .cutscene-animate {
            animation: cutscene-animation 1.5s ease-in-out forwards;
        }

        @keyframes critical-hit-animation {
            0% { transform: scale(0.5) rotate(0deg); opacity: 0; text-shadow: 0 0 0px #fff; }
            50% { transform: scale(1.2) rotate(-5deg); opacity: 1; text-shadow: 0 0 20px #ff0, 0 0 30px #ff0; }
            100% { transform: scale(1) rotate(0deg); opacity: 0; }
        }
        .critical-hit-animate {
            animation: critical-hit-animation 1.2s ease-out forwards;
            color: #ffdd00;
        }

        @keyframes critical-fail-animation {
            0% { transform: translateY(-100px); opacity: 0; }
            30% { transform: translateY(0); opacity: 1; }
            40% { transform: translateX(-10px) rotate(-5deg); }
            50% { transform: translateX(10px) rotate(5deg); }
            60% { transform: translateX(0) rotate(0); }
            100% { transform: translateY(100px); opacity: 0; }
        }
        .critical-fail-animate {
            animation: critical-fail-animation 1.2s ease-in forwards;
            color: #ef4444;
        }
        .xp-bar-fill {
            transition: width 0.5s ease-in-out;
        }
        @keyframes shake {
          10%, 90% { transform: translate3d(-1px, 0, 0); }
          20%, 80% { transform: translate3d(2px, 0, 0); }
          30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
          40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        .shake-effect {
          animation: shake 0.82s cubic-bezier(.36,.07,.19,.97) both;
        }
    </style>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen p-4">
    <div class="vignette"></div>

    <div id="loading-overlay" class="loading-overlay">
        <div class="text-center">
            <svg class="animate-spin h-10 w-10 text-white mx-auto mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="http://www.w3.org/2000/svg"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            <p class="text-xl">데이터를 불러오는 중...</p>
        </div>
    </div>

    <div id="game-container" class="w-full max-w-3xl bg-gray-800 rounded-lg shadow-2xl p-8 border border-gray-700 hidden">
        <div class="mb-6">
            <div class="mb-4">
                <div class="flex justify-between items-center mb-1 text-lg">
                    <p class="font-bold">LV <span id="player-level">1</span></p>
                    <p id="stat-points-display" class="hidden text-yellow-400 font-bold animate-pulse">스탯 포인트 보유!</p>
                    <p class="text-sm text-gray-400">XP: <span id="player-xp">0</span> / <span id="player-xp-next">5</span></p>
                </div>
                <div class="w-full bg-gray-700 rounded-full h-2.5">
                    <div id="xp-bar" class="bg-blue-600 h-2.5 rounded-full xp-bar-fill" style="width: 0%"></div>
                </div>
            </div>
            <div id="player-stats" class="grid grid-cols-4 sm:grid-cols-7 gap-4 text-center mb-4">
                <div class="bg-gray-700 p-2 rounded-lg"><p class="text-sm text-red-400">체력</p><p id="stat-hp" class="text-xl font-bold">100</p></div>
                <div class="bg-gray-700 p-2 rounded-lg"><p class="text-sm text-blue-400">마나</p><p id="stat-mp" class="text-xl font-bold">50</p></div>
                <div class="bg-gray-700 p-2 rounded-lg"><p class="text-sm text-orange-400">근력</p><p id="stat-str" class="text-xl font-bold">10</p></div>
                <div class="bg-gray-700 p-2 rounded-lg"><p class="text-sm text-purple-400">지성</p><p id="stat-int" class="text-xl font-bold">10</p></div>
                <div class="bg-gray-700 p-2 rounded-lg"><p class="text-sm text-green-400">민첩</p><p id="stat-dex" class="text-xl font-bold">10</p></div>
                <div class="bg-gray-700 p-2 rounded-lg"><p class="text-sm text-yellow-400">재주</p><p id="stat-luk" class="text-xl font-bold">10</p></div>
                <div class="bg-yellow-800 p-2 rounded-lg col-span-4 sm:col-span-1"><p class="text-sm text-yellow-300">골드</p><p id="stat-gold" class="text-xl font-bold">1000</p></div>
            </div>
            <div id="inventory-display" class="bg-gray-900/50 p-3 rounded-lg border border-gray-600">
                <h3 class="font-bold text-sm mb-2 text-gray-400">인벤토리</h3>
                <ul id="inventory-list" class="flex flex-wrap gap-2"><li class="text-gray-500 text-xs">비어있음</li></ul>
            </div>
        </div>
        <div id="main-content">
            <div id="event-view">
                 <div class="mb-4 rounded-lg overflow-hidden border border-gray-600 shadow-lg">
                    <img id="event-image" src="" alt="Event Image" class="w-full hidden transition-opacity duration-500">
                </div>
                <div id="event-display" class="bg-gray-900/50 p-6 rounded-lg border border-gray-600 min-h-[150px] mb-6">
                    <p id="event-text" class="text-lg leading-relaxed"></p>
                </div>
                <div id="choices-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>
             <div id="shop-container" class="hidden"></div>

            <div id="combat-view" class="hidden">
                <div id="enemy-display" class="bg-red-900/30 p-4 rounded-lg border border-red-700 mb-4 text-center">
                    <h2 id="enemy-name" class="text-2xl font-bold"></h2>
                    <div class="w-full bg-gray-700 rounded-full h-4 my-2"><div id="enemy-hp-bar" class="bg-red-600 h-4 rounded-full" style="width: 100%"></div></div>
                    <p id="enemy-hp-text" class="text-sm"></p>
                    <div id="enemy-status-icons" class="flex justify-center gap-2 mt-2"></div>
                </div>
                 <div id="player-combat-display" class="bg-green-900/30 p-4 rounded-lg border border-green-700 mb-4 text-center">
                    <h2 id="player-name" class="text-2xl font-bold">플레이어</h2>
                     <div id="player-status-icons" class="flex justify-center gap-2 mt-2 h-6"></div>
                </div>
                <div id="combat-log-container" class="bg-gray-900/50 p-4 rounded-lg border border-gray-600 h-40 overflow-y-auto mb-4"><ul id="combat-log"></ul></div>
                <div id="combat-actions" class="grid grid-cols-2 md:grid-cols-5 gap-4">
                    <button data-action="attack" class="combat-action-btn bg-red-600 hover:bg-red-700 p-4 rounded-lg">공격</button>
                    <button data-action="defend" class="combat-action-btn bg-blue-600 hover:bg-blue-700 p-4 rounded-lg">방어</button>
                    <button data-action="magic" class="combat-action-btn bg-purple-600 hover:bg-purple-700 p-4 rounded-lg">마법</button>
                    <button data-action="evade" class="combat-action-btn bg-green-600 hover:bg-green-700 p-4 rounded-lg">회피</button>
                    <button data-action="flee" class="combat-action-btn bg-yellow-600 hover:bg-yellow-700 p-4 rounded-lg">도주</button>
                </div>
                 <div id="victory-actions" class="hidden mt-4"></div>
                 <div id="magic-view" class="hidden"></div>
            </div>
        </div>

        <div id="game-over" class="hidden text-center">
            <h2 class="text-4xl font-bold text-red-500 mb-4">게임 오버</h2>
            <p id="game-over-message" class="text-xl mb-6"></p>
            <button onclick="game.restart()" class="bg-yellow-600 hover:bg-yellow-700 text-white font-bold py-2 px-4 rounded-lg transition duration-300">다시 시작하기</button>
        </div>
        <div id="dice-roll-modal" class="hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 p-4">
            <div class="bg-gray-800 p-8 rounded-lg text-center border border-gray-600 max-w-md w-full">
                <h3 class="text-2xl mb-4 font-bold">판정 결과</h3>
                <div id="dice-roll-result-text" class="text-lg mb-6"></div>
                <button onclick="game.closeDiceModal()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition duration-300">계속</button>
            </div>
        </div>
    </div>
    
    <div id="stat-distribution-overlay" class="hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 p-4">
        <div class="bg-gray-800 p-8 rounded-lg text-center border border-gray-600 max-w-md w-full">
            <h3 class="text-3xl mb-2 font-bold text-yellow-400">레벨 업!</h3>
            <p class="mb-6">분배할 스탯 포인트: <span id="points-to-distribute" class="font-bold text-xl"></span></p>
            <div id="stat-allocation-grid" class="grid grid-cols-1 gap-4 mb-6"></div>
            <button id="confirm-stats-btn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300" disabled>확인</button>
        </div>
    </div>

    <div id="cutscene-overlay" class="hidden fixed inset-0 flex items-center justify-center z-[101] pointer-events-none overflow-hidden"><div id="cutscene-text" class="text-8xl font-black text-white transform -skew-x-12" style="text-shadow: 4px 4px 0px #ff00c1, -4px -4px 0px #00fff7;"></div></div>
    <div id="critical-roll-overlay" class="hidden fixed inset-0 flex items-center justify-center z-[102] pointer-events-none"><div id="critical-roll-text" class="text-8xl font-black" style="text-shadow: 0 0 15px black;"></div></div>

    <div class="fixed top-4 right-4 z-50">
        <a href="{{ url_for('auth.logout') }}" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg transition duration-300">
            로그아웃
        </a>
    </div>

    <script type="module" src="{{ url_for('static', filename='game.js') }}"></script>
</body>
</html>
